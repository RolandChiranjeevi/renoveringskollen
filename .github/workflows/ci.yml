name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Avbryt äldre körningar på samma gren när något nytt pushas.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typer, tester och bygge
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Testerna använder installerad Google Chrome (channel: 'chrome'), som finns på GitHubs Ubuntu-maskiner.
      - run: npm run e2e
      - name: Spara testrapport vid fel
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-rapport
          path: |
            e2e/.report
            e2e/.results
          retention-days: 14
